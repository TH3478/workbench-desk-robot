site_name: Workbench Desk Robot
site_description: 受控工程与操作员文档
docs_dir: docs
strict: true
theme:
  name: mkdocs
nav:
  - 用户手册: user-guide/index.md
  - 安装: user-guide/installation.md
  - 日常操作: user-guide/operation.md
  - 维护: user-guide/maintenance.md
  - 故障排查: user-guide/troubleshooting.md
  - 90 分钟演示: user-guide/demo-runbook.md
  - 项目状态: project-management/status.md
  - 项目计划: project-management/plan.md
  - 产品证据层:
      - 概述: product/README.md
      - 产品简介: product/product-brief.md
      - 90 天执行: product/90-day-plan.md
      - 问题卡模板: product/problem-card-template.md
      - 设计伙伴场景模板: product/design-partner-scenario-template.md
      - 设计伙伴交接边界: product/design-partner-handoff.md
      - 外部反馈模板: product/feedback-record-template.md
      - 指标与决策日志: product/metrics-and-decision-log.md
  - 风险管理: project-management/risk-management.md
  - 看板设计: design/dashboard-design-system.md
  - 看板可用性测试: design/dashboard-usability-test.md
  - 安全计划: security/README.md
  - 安全评审: security/secure-review-standard.md
  - 事件响应: security/incident-response.md
  - 系统架构: architecture/system.md
  - Linux 驱动架构: architecture/linux-drivers.md
  - 硬件:
      - 概述: hardware/README.md
      - 接线: hardware/wiring.md
      - 启动调试与问题排查: hardware/bringup.md
  - API 参考: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - libs/kernel

# 机械臂规划组的 IK 求解器配置。
#
# TRAC-IK 是主求解器（ros-jazzy-trac-ik-kinematics-plugin）：在接近工作区边界的
# 6-DoF 机械臂上，它比 KDL 的伪逆雅可比更快且可靠得多，这正是阶段 1 可达性工况。
# 若 TRAC-IK 不可用，则回退到被注释掉的 KDL 块（随 MoveIt 附带）— 参见
# THIRD_PARTY_REVIEW 退出路径。
#
# 组名与 config/arm.yaml（planning_group）及 SRDF 匹配。
ur_manipulator:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  # "Speed" | "Distance" | "Manipulation1" | "Manipulation2"。Distance 给出最接近
  # 种子的解，从而保持采样位姿 IK 检查的稳定性。
  solve_type: Distance
  position_only_ik: false

  # --- KDL 回退方案（未安装 trac_ik 插件时取消注释） ---
  # kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # kinematics_solver_search_resolution: 0.005
  # kinematics_solver_timeout: 0.05
  # kinematics_solver_attempts: 3

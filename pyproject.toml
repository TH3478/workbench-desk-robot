[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-1"
version = "0.2.0"
description = "Evidence-first embodied-agent simulator foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4,<5",
  "pytest-cov>=5,<8",
  "pytest-benchmark>=4,<6",
  "ruff==0.16.4",
  "pre-commit>=3,<5",
  "kiutils>=1.4,<2",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.27,<2",
]

[tool.setuptools]
packages = [
  "workbench.application",
  "workbench.hardware",
  "workbench.kernel",
  "workbench_task_utils",
  "workbench_agent_runtime",
  "workbench_backend",
  "workbench_contracts",
  "workbench_virtual_mcu",
  "workbench_world_model",
]

[tool.setuptools.package-dir]
"workbench.application" = "libs/application/workbench/application"
"workbench.hardware" = "libs/hardware/workbench/hardware"
"workbench.kernel" = "libs/kernel/workbench/kernel"
workbench_task_utils = "libs/task_utils/workbench_task_utils"
workbench_agent_runtime = "services/agent_runtime/workbench_agent_runtime"
workbench_backend = "services/backend/workbench_backend"
workbench_contracts = "libs/contracts/workbench_contracts"
workbench_virtual_mcu = "firmware/virtual_mcu/workbench_virtual_mcu"
workbench_world_model = "services/world_model/workbench_world_model"

[tool.setuptools.package-data]
workbench_backend = ["api-openapi-v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/kernel/tests"]
python_files = ["test_*.py"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "integration: marks tests as integration tests (跨模块)",
  "regression: marks tests as regression tests (12 场景)",
  "benchmark: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["services", "libs", "firmware"]
omit = ["*/tests/*", "*/__pycache__/*", "*/build/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build"]

# 规则集刻意保持小而高信号。目的是抓真实缺陷（未定义名称、未使用导入、
# 可变默认参数），而不是强加风格偏好。只有在团队认可新增规则带来的收益
# 大于其引发的改动量时，才扩大这个集合。
[tool.ruff.lint]
select = [
  "F",    # pyflakes: undefined names, unused imports, f-string mistakes
  "E",    # pycodestyle errors
  "I",    # import ordering
  "B",    # bugbear: mutable defaults, shadowed loop vars, assert-false
  "BLE",  # broad exceptions must be deliberate
  "UP",   # pyupgrade: no 3.8 idioms in a 3.12 project
  "RUF",  # ruff's own correctness rules
]
ignore = [
  # 这些脚本必须先将被测包的路径加入 sys.path 才能导入它们，
  # 因此 import 不能放在最前面。该模式是有意为之，
  # 也是不安装即可运行这些工具的文档化方式。
  "E402",
]

[tool.ruff.lint.per-file-ignores]
# 测试刻意重复设置并使用字面量固定装置。
"tests/**" = ["B011"]

# 格式由 CI 检查。本地可运行 `make fmt` 自动修复。
[tool.ruff.format]
quote-style = "double"
